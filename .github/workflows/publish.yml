name: Publish
on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write

jobs:
    publish-staging:
        name: Publish to Staging
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: https://registry.npmjs.org/
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Publish to staging with provenance
              run: npm publish --tag staging --provenance --access public

    publish-production:
        name: Publish to Production
        runs-on: ubuntu-latest
        needs: publish-staging
        environment:
            name: production
            url: https://www.npmjs.com/package/react-insta-stories
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: https://registry.npmjs.org/
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Publish to production with provenance
              run: npm publish --tag latest --provenance --access public

name: Publish
on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write

jobs:
    publish-staging:
        name: Stage Package for Approval
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  registry-url: https://registry.npmjs.org/
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Stage package for manual promotion
              run: npm stage publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: Promotion instructions
              run: |
                echo "✅ Package staged successfully!"
                echo ""
                echo "To promote to production, run:"
                echo "  npm dist-tag add react-insta-stories@3.0.0 latest"
                echo ""
                echo "Or install the staged version to test first:"
                echo "  npm install react-insta-stories@staging"
